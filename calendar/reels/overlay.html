<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap">
<style>
/* Reel overlay, 1080 x 1920. The video window (1080 x 1350 at y 285) shows the clip track underneath
   wherever this page is transparent. Everything that moves is a CSS animation; render.js pauses them all
   and seeks every frame, so the output is frame-exact. */
:root{--g:#004F23;--l:#E0E64A;--n:#131D4A;--ink:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff}
.band{position:absolute;left:0;right:0;background:var(--g)}
.top{top:0;height:285px}
.bot{top:1635px;height:285px}
.logo{position:absolute;left:56px;top:150px;background:#fff;border-radius:999px;padding:16px 30px;display:flex;align-items:center}
.logo img{height:40px;display:block}
.eyebrow{position:absolute;right:56px;top:156px;background:var(--l);color:var(--g);font-weight:800;font-size:25px;letter-spacing:3px;text-transform:uppercase;padding:14px 26px;border-radius:999px;animation:pop .5s cubic-bezier(.2,1.5,.4,1) .15s both}
.handle{position:absolute;left:56px;top:1680px;font-weight:600;font-size:28px;opacity:.85}
.bar{position:absolute;left:0;top:1635px;height:8px;background:var(--l);width:1080px;transform-origin:0 50%;transform:scaleX(0)}

/* photos (stills) inside the video window, with a slow camera move */
.win{position:absolute;left:0;top:285px;width:1080px;height:1350px;overflow:hidden}
.still{position:absolute;inset:0;opacity:0}
.still img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;left:0;right:0;bottom:0;height:720px;background:linear-gradient(180deg,rgba(0,79,35,0),rgba(0,40,18,.55) 45%,rgba(0,30,14,.86));opacity:0}

/* captions: word by word, with a lime highlighter on [[key words]] */
.cap{position:absolute;left:64px;right:64px;bottom:430px;font-weight:800;font-size:84px;line-height:1.06;letter-spacing:-.5px;opacity:1}
.cap.small{font-size:66px}
.cap .w{display:inline-block;margin-right:.24em}
.cap .hl{color:var(--g);background:var(--l);padding:0 .12em;margin-right:0}
.cap .hl.a{border-radius:8px 0 0 8px;margin-left:-.06em}.cap .hl.z{border-radius:0 8px 8px 0;margin-right:.24em}.cap .hl.a.z{border-radius:8px}
.sub{position:absolute;left:64px;right:64px;bottom:360px;font-weight:600;font-size:34px;color:var(--l)}

/* the 20-second timer */
.timer{position:absolute;right:64px;top:64px;width:220px;height:220px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:76px;color:#fff}

/* end card */
.end{position:absolute;inset:0;background:var(--g);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 90px;gap:34px;clip-path:circle(0% at 50% 60%)}
.end .lg{background:#fff;border-radius:999px;padding:22px 40px}
.end .lg img{height:62px;display:block}
.end .t{font-weight:900;font-size:96px;line-height:1.02}
.end .t span{display:block}
.end .t span:nth-child(2){color:var(--l)}
.end .cta{background:var(--l);color:var(--g);font-weight:800;font-size:36px;padding:20px 36px;border-radius:999px}
.end .h2{font-weight:600;font-size:32px;opacity:.85}

@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wordIn{0%{transform:translateY(60px) rotate(4deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes out{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-40px)}}
@keyframes show{0%,100%{opacity:1}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes kbIn{0%{transform:scale(1)}100%{transform:scale(1.14)}}
@keyframes kbOut{0%{transform:scale(1.16)}100%{transform:scale(1.02)}}
@keyframes kbL{0%{transform:scale(1.15) translateX(4%)}100%{transform:scale(1.15) translateX(-4%)}}
@keyframes kbR{0%{transform:scale(1.15) translateX(-4%)}100%{transform:scale(1.15) translateX(4%)}}
@keyframes kbUp{0%{transform:scale(1.15) translateY(4%)}100%{transform:scale(1.15) translateY(-4%)}}
@keyframes reveal{0%{clip-path:circle(0% at 50% 60%)}100%{clip-path:circle(150% at 50% 60%)}}
@keyframes ring{0%{stroke-dashoffset:0}100%{stroke-dashoffset:628}}
</style>
</head>
<body>
<div class="win" id="win"></div>
<div class="band top"><div class="logo"><img src="__LOGO__" alt=""></div><div class="eyebrow" id="eyebrow"></div></div>
<div class="band bot"><div class="handle">@xzonenz · xzone.nz</div></div>
<div class="bar" id="bar"></div>
<div id="layer"></div>
<script>
const R = __REEL__;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total = R.total;
document.getElementById('eyebrow').textContent = R.eyebrow || '';
document.getElementById('bar').style.animation = `grow ${total}s linear 0s both`;
const win = document.getElementById('win'), layer = document.getElementById('layer');
// captions: words rise in one by one; [[...]] gets the lime highlighter
function caption(text, t0, d, cls) {
  const box = document.createElement('div');
  box.className = 'cap ' + (cls || '');
  let i = 0;
  box.innerHTML = text.split(/(\[\[.+?\]\])/).filter(Boolean).flatMap(part => {
    const hl = part.startsWith('[[');
    const words = part.replace(/^\[\[|\]\]$/g, '').trim().split(/\s+/).filter(Boolean);
    return words.map((w, k) => `<span class="w${hl ? ' hl' : ''}${hl && k === 0 ? ' a' : ''}${hl && k === words.length - 1 ? ' z' : ''}" style="animation:wordIn .42s cubic-bezier(.2,1.2,.4,1) ${(t0 + 0.12 + (i++) * 0.09).toFixed(3)}s both">${esc(w)}</span>`);
  }).join('');
  box.style.opacity = 0;
  box.style.animation = `fadeIn .01s linear ${t0}s both, out .3s ease-in ${(t0 + d - 0.3).toFixed(3)}s forwards`;
  layer.appendChild(box);
}
let t = 0;
for (const s of R.segments) {
  if (s.img) {   // a still (photo or held frame) with a slow move
    const st = document.createElement('div');
    st.className = 'still';
    const holdFrom = t + (s.clip || 0);
    st.innerHTML = `<img src="${s.img}" style="object-position:${s.pos || 'center'};animation:${s.kb || 'kbIn'} ${s.dur - (s.clip || 0)}s linear ${holdFrom}s both">`;
    st.style.animation = `show ${(s.dur - (s.clip || 0)).toFixed(3)}s linear ${holdFrom.toFixed(3)}s`;
    win.appendChild(st);
  }
  if (s.text) {
    const sc = document.createElement('div');
    sc.className = 'scrim';
    sc.style.animation = `show ${s.dur}s linear ${t}s`;
    win.appendChild(sc);
    caption(s.text, t, s.dur, s.small ? 'small' : '');
  }
  if (s.sub) {
    const sb = document.createElement('div');
    sb.className = 'sub'; sb.textContent = s.sub; sb.style.opacity = 0;
    sb.style.animation = `fadeIn .3s linear ${t + 0.6}s both, out .3s ease-in ${t + s.dur - 0.3}s forwards`;
    layer.appendChild(sb);
  }
  if (s.timer) {   // a 20-second countdown ring, compressed into the segment
    const tm = document.createElement('div');
    tm.className = 'timer'; tm.style.top = '349px'; tm.style.opacity = 0;
    tm.innerHTML = `<svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="rgba(0,40,18,.6)" stroke="rgba(255,255,255,.25)" stroke-width="12"/><circle cx="110" cy="110" r="100" fill="none" stroke="#E0E64A" stroke-width="12" stroke-linecap="round" stroke-dasharray="628" style="animation:ring ${s.dur - 0.4}s linear ${t + 0.2}s both"/></svg><div class="num"></div>`;
    tm.style.animation = `pop .4s cubic-bezier(.2,1.5,.4,1) ${t}s both, out .3s ease-in ${t + s.dur - 0.3}s forwards`;
    tm.dataset.t0 = t + 0.2; tm.dataset.d = s.dur - 0.4; tm.dataset.n = s.timer;
    layer.appendChild(tm);
  }
  t += s.dur;
}
// end card
const e = R.end;
const end = document.createElement('div');
end.className = 'end';
end.style.animation = `reveal .7s cubic-bezier(.6,0,.2,1) ${t}s both`;
end.innerHTML = `<div class="lg" style="animation:pop .5s cubic-bezier(.2,1.5,.4,1) ${t + .45}s both"><img src="__LOGO__" alt=""></div>
  <div class="t">${e.lines.map((l, i) => `<span style="animation:wordIn .5s cubic-bezier(.2,1.2,.4,1) ${(t + .7 + i * .25).toFixed(2)}s both">${esc(l)}</span>`).join('')}</div>
  ${e.cta ? `<div class="cta" style="animation:pop .5s cubic-bezier(.2,1.5,.4,1) ${(t + 1.4).toFixed(2)}s both">${esc(e.cta)}</div>` : ''}
  <div class="h2" style="animation:fadeIn .4s linear ${(t + 1.7).toFixed(2)}s both">@xzonenz · xzone.nz</div>`;
document.body.appendChild(end);
// seek every animation to time `sec` (called per frame by render.js); the timer digits follow it too
window.seek = sec => {
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = sec * 1000; }
  for (const tm of document.querySelectorAll('.timer')) {
    const p = Math.min(1, Math.max(0, (sec - Number(tm.dataset.t0)) / Number(tm.dataset.d)));
    tm.querySelector('.num').textContent = Math.ceil(tm.dataset.n * (1 - p));
  }
};
window.READY = true;
</script>
</body>
</html>
