<title>X-ZONE Ambassador Posts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap">
<style>
/* Layout: one band per ambassador. Website article on the left, the social posts that point to it on the right, checks underneath. */
:root{
  --bg:#F3F4EE; --panel:#FFFFFF; --fg:#1F1C1D; --muted:#5D6158; --line:#DADDD2;
  --green:#0D441F; --lime:#E0E64A; --navy:#131D4A; --orange:#F3AC3E; --black:#1F1C1D; --red:#E44726;
  --flag-bg:#FFF6E2; --flag-fg:#5A3D07; --flag-line:#F3AC3E;
  --font:"Poppins", "Galano Grotesque", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --panel:#1A201C; --fg:#ECEFE6; --muted:#A3AA9D; --line:#2E3630;
  --flag-bg:#2A2312; --flag-fg:#F5DDA9; --flag-line:#8A6420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#1A201C; --fg:#ECEFE6; --muted:#A3AA9D; --line:#2E3630;
  --flag-bg:#2A2312; --flag-fg:#F5DDA9; --flag-line:#8A6420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* page header */
.top{background:var(--green);color:#fff}
.top .wrap{padding-block:28px 24px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.top img{height:34px;width:auto;display:block;margin-bottom:14px}
.top h1{font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.05}
.top p{margin:6px 0 0;color:#CFE0C9;max-width:60ch}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.top nav a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.top nav a:hover,.top nav a:focus-visible{background:var(--lime);color:var(--green);border-color:var(--lime);outline:none}

.amb{padding-block:40px 8px}
.amb + .amb{border-top:1px solid var(--line)}
.amb-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:20px}
.amb-head .num{font-size:44px;font-weight:900;line-height:1;color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .amb-head .num{color:var(--lime)}}
:root[data-theme="dark"] .amb-head .num{color:var(--lime)}
.amb-head h2{font-size:24px;font-weight:800}
.amb-head .meta{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.col-title{margin-bottom:10px}

/* ---------- website (fixed light, it is a picture of xzone.nz) ---------- */
.browser{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;color:#1F1C1D;box-shadow:0 10px 30px rgba(13,68,31,.10)}
.bar{display:flex;align-items:center;gap:8px;background:#ECEDE8;padding:9px 12px}
.bar i{width:10px;height:10px;border-radius:50%;background:#C9CBC2;display:block}
.bar span{flex:1;min-width:0;background:#fff;border-radius:6px;padding:3px 10px;font-size:12px;color:#5D6158;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid #E6E8E0;flex-wrap:wrap}
.site-nav img{height:26px;width:auto}
.site-nav ul{display:flex;gap:18px;list-style:none;margin:0;padding:0;font-size:13px;font-weight:500;flex-wrap:wrap}
.site-nav li.on{color:var(--green);font-weight:700}
.article{max-width:720px;margin:0 auto;padding:32px 24px 40px}
.article .series{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.article h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;line-height:1.08;margin:8px 0 10px;color:var(--green)}
.byline{display:flex;gap:14px;align-items:center;font-size:13px;color:#5D6158;flex-wrap:wrap}
.byline b{font-weight:600;color:#1F1C1D}
.share{border:1px solid #DADDD2;border-radius:999px;padding:2px 12px;font-weight:600;color:#1F1C1D}
.intro{margin:22px 0;padding:18px 20px;background:#F1F5EC;border-radius:8px;font-size:15px;color:#2E332B}
.intro p{margin:0 0 8px}.intro p:last-child{margin:0;font-weight:600;color:var(--green)}
.hero{margin:0 0 6px}
.hero img,.inline-photo img{width:100%;height:auto;display:block;border-radius:6px}
.hero img{aspect-ratio:4/3;object-fit:cover;object-position:center 25%}
.hero .ph{aspect-ratio:4/3}
.cap{font-size:12px;color:#5D6158;margin:6px 0 0}
.amb-title{font-size:20px;font-weight:800;margin:26px 0 4px}
.article h3{font-size:16px;font-weight:700;margin:26px 0 8px;color:var(--green);line-height:1.35}
.article p.a{margin:0 0 12px;font-size:16px;line-height:1.65;font-weight:400}
.pull{margin:26px 0;padding:4px 0 4px 20px;border-left:4px solid var(--lime);font-size:21px;line-height:1.35;font-weight:700;color:var(--green)}
.inline-photo{margin:22px 0}
.more{margin-top:30px;padding-top:18px;border-top:1px solid #E6E8E0;font-size:15px}
.more a{color:var(--green);font-weight:700}
.ph{aspect-ratio:4/5;width:100%;border-radius:6px;display:grid;place-items:center;text-align:center;padding:20px;
  background:repeating-linear-gradient(135deg,#E9ECE3 0 14px,#F4F6F0 14px 28px);color:#5D6158;font-size:13px;font-weight:500;border:1px dashed #B9BDB0}
.ph b{display:block;color:#1F1C1D;font-size:14px;margin-bottom:4px}

/* ---------- Instagram (fixed brand colours) ---------- */
.ig{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ig-head{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px;font-weight:600}
.ava{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.ava img{width:22px;height:auto}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin}
.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5;position:relative;overflow:hidden;color:#fff;container-type:inline-size}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .ph{position:absolute;inset:0;border-radius:0;aspect-ratio:auto;border:0}
.cover{display:flex;flex-direction:column}
.cover .band{flex:0 0 auto;background:var(--green);padding:6cqw 6cqw 5cqw}
.cover .bg{position:relative;inset:auto;flex:1 1 auto;min-height:0;object-position:center 18%}
.cover .ph{position:relative;flex:1 1 auto}
.band .logo{height:5.4cqw;width:auto;display:block;margin-bottom:4cqw}
.band h4{margin:0;font-size:8.6cqw;line-height:1.02;font-weight:800;letter-spacing:-.01em}
.band p{margin:2.2cqw 0 0;font-size:3.9cqw;font-weight:600;color:var(--lime)}
.pill{position:absolute;top:5.4cqw;right:6cqw;font-size:3cqw;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1.2cqw 3cqw;border-radius:999px;color:#fff}
.foot{position:absolute;left:6cqw;right:6cqw;bottom:4.5cqw;display:flex;justify-content:space-between;font-size:3cqw;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.quote-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:10cqw 9cqw}
.quote-slide .mark{font-size:30cqw;line-height:.6;font-weight:900;height:14cqw}
.quote-slide blockquote{margin:0;font-size:6.6cqw;line-height:1.22;font-weight:700}
.quote-slide .who{margin-top:7cqw;font-size:3.8cqw;font-weight:600;opacity:.95}
.quote-slide .who b{display:block;font-size:4.6cqw;font-weight:800}
.quote-slide .logo{position:absolute;left:9cqw;bottom:7cqw;height:5cqw;width:auto}
.wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,68,31,0) 35%,rgba(13,68,31,.88) 82%)}
.end{position:absolute;left:6cqw;right:6cqw;bottom:13cqw}
.end h4{margin:0;font-size:8cqw;font-weight:800;line-height:1.05}
.end p{margin:2cqw 0 0;font-size:4cqw;font-weight:600;color:var(--lime)}
.dots{display:flex;justify-content:center;gap:5px;padding:8px 0 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i:first-child{background:#3897F0}
.ig-body{padding:8px 12px 14px;font-size:13.5px}
.caption{white-space:pre-line}
.caption b{font-weight:700}
.tags{color:#2F6FB0;margin-top:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tags{color:#7DB3EA}}
:root[data-theme="dark"] .tags{color:#7DB3EA}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}

/* ---------- Facebook ---------- */
.fb{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:20px;font-size:14px}
.fb .who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fb .who small{display:block;color:var(--muted);font-size:12px}
.fb .caption{margin-bottom:10px}
.link-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;grid-template-columns:110px minmax(0,1fr)}
.link-card img,.link-card .ph{width:110px;height:100%;min-height:96px;object-fit:cover;aspect-ratio:auto;border-radius:0;border:0;padding:6px;font-size:10px}
.link-card div.t{padding:10px 12px;min-width:0}
.link-card small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.link-card b{display:block;font-size:14px;line-height:1.3;margin-top:2px}

/* ---------- checks ---------- */
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;margin:28px 0 32px}
.box{border-radius:10px;padding:16px 18px;min-width:0}
.box h3{font-size:15px;font-weight:700;margin-bottom:8px}
.box ul{margin:0;padding-left:18px;font-size:14px}
.box li{margin:4px 0}
.edits{background:var(--panel);border:1px solid var(--line)}
.flags{background:var(--flag-bg);color:var(--flag-fg);border:1px solid var(--flag-line)}
footer{padding-block:24px 40px;color:var(--muted);font-size:13px}
</style>

<header class="top">
  <div class="wrap">
    <div>
      <img src="{{LOGO_WHITE}}" alt="X-ZONE New Zealand">
      <h1>Ambassador posts</h1>
      <p>Each ambassador's story as a blog post on xzone.nz, with the Instagram carousel and Facebook post that point to it. Draft for Jess and Dan to approve.</p>
    </div>
    <nav aria-label="Ambassadors">{{NAV}}</nav>
  </div>
</header>

<main class="wrap">
{{SECTIONS}}
</main>
<footer class="wrap">Built by <code>ambassadors/build.py</code> from <code>ambassadors/content/*.json</code>. Brand rules: <code>brief/06-brand-spec.md</code>.</footer>
